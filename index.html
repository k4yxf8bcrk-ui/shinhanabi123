<!doctype html>
<html lang="ja">
<head>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>新ハナビ店舗別データ分析</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;color:#202124;background:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:#f5f6f8}.wrap{width:min(1180px,calc(100% - 28px));margin:24px auto 60px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:16px}h1{font-size:clamp(24px,4vw,34px);margin:0 0 6px}h2{margin:0;font-size:19px}.muted{color:#6b7280;font-size:13px}.pill{padding:7px 12px;border-radius:999px;background:#e8f0fe;color:#174ea6;font-weight:800;white-space:nowrap}.panel{background:#fff;border:1px solid #e2e5e9;border-radius:14px;padding:18px;margin-top:15px;box-shadow:0 3px 14px rgba(0,0,0,.035)}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.controls label{font-weight:800;font-size:13px;display:flex;flex-direction:column;gap:6px}select{width:100%;border:1px solid #cfd4dc;border-radius:9px;padding:10px 11px;background:#fff;font:inherit}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:15px}.card{border:1px solid #e1e5eb;border-radius:12px;padding:13px;background:#fafbfc}.card .k{font-size:12px;color:#6b7280}.card .v{font-size:19px;font-weight:900;margin-top:5px;font-variant-numeric:tabular-nums}.blue{color:#1a73e8}.red{color:#d93025}.chartWrap{position:relative;margin-top:14px;border:1px solid #e1e5eb;border-radius:12px;overflow:hidden;background:#fff}.chartWrap canvas{display:block;width:100%;height:430px}.tooltip{display:none;position:absolute;z-index:2;min-width:160px;padding:8px 10px;border-radius:8px;background:rgba(17,24,39,.94);color:#fff;font-size:12px;line-height:1.55;pointer-events:none}.legend{margin-top:9px;color:#667085;font-size:12px;line-height:1.7}.tableWrap{overflow:auto;margin-top:12px;border:1px solid #e1e5eb;border-radius:10px}table{width:100%;min-width:900px;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:8px 10px;border-bottom:1px solid #edf0f3;text-align:right;white-space:nowrap;font-size:13px}th{background:#f7f8fa;position:sticky;top:0;color:#4b5563}th:first-child,td:first-child{text-align:left}.status{padding:14px;border-radius:10px;background:#f7f9fc;color:#4b5563;line-height:1.7}.error{background:#fff0ef;color:#a61b14;border:1px solid #f0c1bd}.trendBox{margin-top:14px;border:1px solid #dfe5ee;border-radius:12px;padding:14px;background:#f8fafc}.trendBox:empty{display:none}.trendCurrent{font-size:14px;font-weight:800;margin-bottom:10px}.trendGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.trendCard{background:#fff;border:1px solid #e1e5eb;border-radius:10px;padding:11px}.trendCard .k{font-size:11px;color:#6b7280}.trendCard .v{font-size:17px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}.trendNote{margin-top:9px;color:#6b7280;font-size:11px;line-height:1.6}.trendLow{color:#9a5b00}.trendGood{color:#0f7b3e}@media(max-width:800px){.controls,.cards,.trendGrid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.hero{flex-direction:column}.controls,.cards,.trendGrid{grid-template-columns:1fr}.wrap{width:calc(100% - 18px)}}
.predictionPanel{border-color:#c9d9f5;background:#fbfcff}.predictionHead{display:flex;justify-content:space-between;gap:12px;align-items:center}.predictionGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:13px}.predictionCard{border:1px solid #dfe5ee;border-radius:12px;padding:12px;background:#fff;min-width:0}.predictionCard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.predictionCard .machine{font-weight:900;font-size:17px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.rankBadge{font-size:10px;padding:2px 6px;border-radius:999px;background:#e8f0fe;color:#174ea6}.predictionCard .score{font-size:24px;font-weight:950;white-space:nowrap}.streakStrip{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;padding:7px 8px;border-radius:8px;background:#f3f5f8;font-size:11px}.streakStrip span{color:#6b7280}.streakStrip strong{font-size:13px}.streakStrip small{color:#6b7280}.predMetrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}.predMetric{border:1px solid #e5e9ef;border-radius:8px;padding:7px 8px;background:#fff;min-width:0}.predMetric span{display:block;color:#6b7280;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.predMetric strong{display:block;margin-top:2px;font-size:14px;font-variant-numeric:tabular-nums}.predMetric small{display:block;color:#7a828d;font-size:9px;margin-top:1px}.predFoot{font-size:10px;color:#6b7280;margin-top:7px}.aiBox{margin-top:14px;border:1px solid #dfe5ee;border-radius:12px;padding:13px;background:#f8fafc;line-height:1.6}.aiBox:empty{display:none}.aiBox h3{margin:0 0 7px;font-size:16px}.aiRank{display:grid;gap:7px;margin-top:8px}.aiRankCard{padding:10px!important;background:#fff;border:1px solid #e1e5eb;border-radius:9px}.aiRankHead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:5px}.rankNo{font-size:10px;background:#eef3fb;border-radius:999px;padding:2px 7px}.machineStrong{font-size:15px;font-weight:900}.conf{font-size:10px;color:#5f6368;border:1px solid #dfe5ee;border-radius:999px;padding:2px 7px}.aiDetail{display:grid;grid-template-columns:70px 1fr;gap:7px;font-size:11px;margin-top:4px}.aiDetail span:first-child{color:#6b7280}.factors{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:7px;font-size:10px}.factors em{font-style:normal;border-radius:999px;padding:3px 7px}.factors.plus em{background:#eef5ff;color:#1758a8}.factors.minus em{background:#fff0ef;color:#a72b20}.aiWatch{margin-top:9px;padding:9px 11px;background:#fff;border:1px solid #e1e5eb;border-radius:9px}.aiWatch ul{margin:5px 0 0 18px;padding:0}.aiWatch li{font-size:11px;margin:2px 0}.tiny{font-size:11px;color:#6b7280}@media(max-width:900px){.predictionGrid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.predictionGrid{grid-template-columns:1fr}.predictionHead{align-items:flex-start;flex-direction:column}.predMetrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.aiAccuracyBox{margin-top:10px;border:1px solid #dfe5ee;border-radius:12px;padding:13px;background:#f8fafc}.aiAccuracyBox:empty{display:none}.aiAccuracyBox h3{margin:0 0 8px;font-size:16px}.aiAccGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.aiAccCard{background:#fff;border:1px solid #e1e5eb;border-radius:9px;padding:9px;min-width:0}.aiAccCard span{display:block;font-size:10px;color:#6b7280}.aiAccCard strong{display:block;font-size:17px;margin-top:3px;font-variant-numeric:tabular-nums}.aiAccCard small{display:block;font-size:9px;color:#8a919b;margin-top:1px}.aiAccRecent{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:10px}.aiAccRecent>span{color:#6b7280}.aiAccRecent em{font-style:normal;border-radius:999px;padding:3px 7px;background:#f2f4f7}.aiAccRecent em.hit{background:#eef5ff;color:#1758a8}.aiAccRecent em.miss{background:#fff0ef;color:#a72b20}@media(max-width:850px){.aiAccGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.editorChiefBox{margin-top:12px;border:1px solid #d9c7f3;border-radius:12px;padding:13px;background:#fcfaff;line-height:1.6}.editorChiefBox:empty{display:none}.editorChiefBox h3,.editorChiefAccuracy h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.editorBadge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;background:#f0e8ff;color:#6b3fa0;font-size:10px;font-weight:800}.editorChiefBox .rankNo{background:#f0e8ff;color:#6b3fa0}.editorChiefAccuracy{border-color:#d9c7f3;background:#fcfaff}
.editorComment{margin-top:10px;border:1px solid #e3d7f5;border-radius:10px;background:#fff}.editorComment summary{cursor:pointer;padding:10px 12px;font-weight:800;color:#6b3fa0;list-style:none}.editorComment summary::-webkit-details-marker{display:none}.editorComment summary:after{content:"＋";float:right}.editorComment[open] summary:after{content:"−"}.editorCommentBody{padding:0 12px 12px;color:#374151;font-size:12px;line-height:1.85}.editorCommentBody p{margin:9px 0}.editorCommentBody p:first-child{margin-top:0}
.storePanel{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:14px 18px;background:#fff;border:1px solid #dbe3ef;border-radius:14px;margin-bottom:14px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.025)}.storePanel label{font-weight:900;display:flex;flex-direction:column;gap:7px;min-width:min(100%,320px);flex:1}.storePanel select{font-weight:700}.storePanel .storeHint{flex:2;color:#566072;font-size:12px;line-height:1.7;padding-top:4px;min-width:210px}.storeNotice{margin:0 0 14px;border:1px solid #f3d89b;background:#fffaf0;border-radius:10px;padding:12px 14px;line-height:1.7;font-size:13px;color:#765321}.storeNotice[hidden]{display:none}

/* スマホ用グラフ専用表示（ブラウザに応じた表示領域一杯） */
.graphFocusLaunch{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.graphFocusLaunch button,.graphFocusClose{font:inherit;font-weight:800;border:1px solid #1a73e8;border-radius:11px;background:#1a73e8;color:#fff;padding:11px 18px;cursor:pointer;touch-action:manipulation}
.graphFocusLaunch button:focus-visible,.graphFocusClose:focus-visible{outline:3px solid #f5b72b;outline-offset:2px}
.graphFocusLaunch small{color:#6b7280;font-size:12px}
.graphFocusLayer[hidden]{display:none!important}
.graphFocusLayer{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;z-index:10000;background:#fff;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.graphFocusHead{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:#f3f6fb;border-bottom:1px solid #dce4ef}
.graphFocusTitle{min-width:0;font-size:14px;font-weight:900;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.graphFocusClose{padding:9px 13px;white-space:nowrap;background:#fff;color:#174ea6;border-color:#a8bfeb}
.graphFocusSelectors{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:9px 10px;border-bottom:1px solid #edf0f3;background:#fff}
.graphFocusSelectors label{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:11px;font-weight:700;color:#455066}
.graphFocusSelectors select{min-width:0;width:100%;padding:8px 5px;font-size:13px}
#focusChartSlot{min-height:0;flex:1 1 auto;display:flex;padding:8px 4px 4px;overflow:hidden}
#focusChartSlot .chartWrap{flex:1;min-width:0;min-height:0;width:100%;height:100%;margin:0;border-radius:5px}
#focusChartSlot .chartWrap canvas{height:100%;min-height:0;touch-action:none}
.graphFocusStats{flex:0 0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:7px 9px;border-top:1px solid #e2e5eb;background:#f8fafc;max-height:34dvh;overflow-y:auto}
.graphFocusStats .focusStat{min-width:0;padding:7px 9px;border:1px solid #e2e8f0;border-radius:9px;background:#fff}
.graphFocusStats .focusStatLabel{font-size:11px;color:#596579;margin-bottom:3px}
.graphFocusStats .focusStatValue{font-size:12px;font-weight:800;line-height:1.5;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.graphFocusStats .focusStatValue.blue{color:#1a73e8}
.graphFocusStats .focusStatValue.red{color:#d93025}
.graphFocusStats .focusStatEmpty{grid-column:1/-1;font-size:12px;color:#64748b}
.graphFocusFoot{flex:0 0 auto;padding:5px 12px 8px;min-height:24px;font-size:11px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.graphFocusOpen{overflow:hidden}
@media(max-width:560px){.graphFocusSelectors{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:400px){.graphFocusHead{padding:7px 9px}.graphFocusSelectors{gap:4px;padding:7px 5px}.graphFocusSelectors select{font-size:12px;padding:7px 3px}.graphFocusLaunch button{width:100%}}
@media(orientation:landscape) and (max-height:550px){.graphFocusStats{grid-template-columns:repeat(4,minmax(0,1fr));padding:4px 8px;gap:5px;max-height:85px}.graphFocusStats .focusStat{padding:4px 6px}.graphFocusStats .focusStatLabel{font-size:10px}.graphFocusStats .focusStatValue{font-size:10px}.graphFocusHead{padding:3px 9px}.graphFocusSelectors{grid-template-columns:repeat(4,minmax(0,1fr));padding:4px 9px}.graphFocusSelectors label{flex-direction:row;align-items:center}.graphFocusSelectors select{padding:4px 6px}.graphFocusFoot{padding:2px 10px}}

/* 2026-10-20: グラフだけ表示・スマートフォン専用。PC表示には影響させない。 */
@media (pointer: coarse) and (max-width: 650px){
  .graphFocusLayer .graphFocusHead{padding:6px 9px;gap:7px}
  .graphFocusLayer .graphFocusTitle{font-size:12px}
  .graphFocusLayer .graphFocusClose{padding:6px 10px;font-size:13px;border-radius:9px}
  .graphFocusLayer .graphFocusSelectors{gap:5px;padding:6px 7px}
  .graphFocusLayer .graphFocusSelectors label{font-size:10px;gap:2px}
  .graphFocusLayer .graphFocusSelectors select{padding:6px 6px;font-size:12px;min-height:32px}
  .graphFocusLayer #focusChartSlot{padding:4px 2px 2px}
  .graphFocusLayer .graphFocusStats{gap:4px;padding:5px 7px;max-height:25dvh}
  .graphFocusLayer .focusStat{padding:5px 7px;border-radius:8px}
  .graphFocusLayer .focusStatLabel{font-size:10px;line-height:1.2;margin-bottom:2px}
  .graphFocusLayer .focusStatValue{font-size:11px;line-height:1.3;letter-spacing:-.2px;overflow-wrap:anywhere}
  .graphFocusLayer .graphFocusFoot{padding:3px 8px 4px;min-height:18px;font-size:10px}
}


/* スマホの「グラフだけ表示」拡大縮小 */
.graphZoomControls{display:none;align-items:center;gap:4px;flex:0 0 auto}
.graphZoomControls button{border:1px solid #c6d5ef;border-radius:8px;background:#fff;color:#174ea6;font:800 14px system-ui;height:29px;min-width:29px;padding:0 5px;touch-action:manipulation}
.graphZoomControls button:disabled{opacity:.35}
.graphZoomControls .graphZoomReset{font-size:10px}
.graphZoomRatio{font-size:10px;min-width:32px;text-align:center;color:#445268;font-weight:700}
@media (pointer:coarse) and (max-width:650px), (pointer:coarse) and (max-height:650px){
 .graphFocusLayer .graphZoomControls{display:flex}
 .graphFocusLayer .graphFocusTitle{flex:1;min-width:0}
 .graphFocusLayer .graphFocusHead{gap:5px}
}
@media (pointer:coarse) and (orientation:landscape) and (max-height:650px){
 .graphFocusLayer .graphZoomControls button{height:24px;min-width:27px}
}

/* REG先行の翌日実績：当日1,000G以上・同じ台番の翌日データを集計 */
.regBiasBox{margin-top:12px;border:1px solid #d9e4f0;border-radius:12px;padding:13px;background:#f8fbff;line-height:1.6}
.regBiasBox:empty{display:none}
.regBiasBox h3{margin:0 0 7px;font-size:16px}
.regBiasBox .regBiasSummary{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.regBiasBox .regBiasChip{display:flex;flex-direction:column;flex:1;min-width:125px;border:1px solid #e0e8f4;background:white;border-radius:9px;padding:7px 10px}
.regBiasBox .regBiasChip span{font-size:11px;color:#566579}
.regBiasBox .regBiasChip strong{font-size:15px}
.regBiasBox .regBiasMachines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:9px 0}
.regBiasBox .regBiasMachine{background:#fff;border:1px solid #dfe6f0;border-radius:10px;padding:9px;min-width:0;font-size:12px}
.regBiasBox .regBiasMachine strong{display:block;font-size:15px;margin-bottom:2px}
.regBiasBox .regBiasMachine .tiny{font-size:10px}
@media(max-width:620px){.regBiasBox .regBiasMachines{grid-template-columns:1fr}.regBiasBox .regBiasMachine{padding:8px 10px}}


/* AIと編集長：予想1位/2位/3位の実績を並べて比較 */
.rankAuditBox{margin-top:13px;background:#fff;border:1px solid #cbd9ee;border-radius:12px;padding:13px;line-height:1.6}
.rankAuditBox:empty{display:none}
.rankAuditBox h3{margin:0 0 5px;font-size:16px}
.rankAuditGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:12px}
.rankAuditCard{background:#f8fafc;border:1px solid #e0e6ef;border-radius:10px;padding:12px;min-width:0}
.rankAuditCard h4{font-size:15px;margin:0 0 4px}
.rankAuditTable{min-width:0!important;width:100%;table-layout:fixed;border-collapse:collapse;margin-top:7px}
.rankAuditTable th,.rankAuditTable td{padding:7px 3px;border-bottom:1px solid #e4e8f0;text-align:center!important;white-space:normal;font-size:12px;vertical-align:middle;position:static}
.rankAuditTable th{font-size:10px;color:#505a6a;background:#edf2fa}
.rankAuditTable th:first-child,.rankAuditTable td:first-child{width:44px}
.rankAuditTable td strong{font-size:14px;display:block;font-variant-numeric:tabular-nums}
.rankAuditTable td small{font-size:10px;color:#64748b;display:block}
.rankAuditTable .rankAuditBest{background:#eaf3ff}
.rankAuditNote{font-size:11px;color:#546075;margin-top:8px}
.rankAuditDetails{margin-top:12px;border:1px solid #e2e8f0;border-radius:9px;background:#fff}
.rankAuditDetails summary{padding:9px 11px;cursor:pointer;font-weight:700;font-size:12px}
.rankAuditDetailScroll{overflow-x:auto;padding:0 9px 8px}
.rankAuditDetailTable{width:100%;min-width:410px;table-layout:auto;border-collapse:collapse}
.rankAuditDetailTable th,.rankAuditDetailTable td{padding:5px 6px;text-align:left!important;font-size:11px;white-space:nowrap;position:static}
.rankAuditDetailTable td small{display:inline;font-size:10px}
@media(max-width:920px){.rankAuditGrid{grid-template-columns:1fr}}
@media(max-width:480px){.rankAuditBox{padding:10px}.rankAuditCard{padding:8px}.rankAuditTable td strong{font-size:13px}.rankAuditTable th,.rankAuditTable td{font-size:11px;padding:7px 2px}}

</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <div><h1 id="title">データ</h1><div id="subtitle" class="muted">データを読み込んでいます…</div></div>
    <div class="pill">新ハナビ</div>
  </header>

  <section class="storePanel" aria-label="店舗選択">
    <label for="storeSelect">店舗を切り替える
      <select id="storeSelect">
        <option value="yuto">コンコルド浜松雄踏店</option>
        <option value="morita">ABC浜松森田町店（ABC森田）</option>
      </select>
    </label>
    <div class="storeHint">店舗ごとに台データ・グラフ・予想履歴を分けて表示します。既存の雄踏店データはそのまま保持しています。</div>
  </section>
  <div id="storeNotice" class="storeNotice" hidden></div>
  <div id="loadStatus" class="panel status">選択した店舗のデータを読み込んでいます…</div>

  <section id="predictionPanel" class="panel predictionPanel" hidden>
    <div class="predictionHead"><div><h2 id="predictionHeading">今日 / 次回の参考予想</h2><div id="predictionExplainer" class="muted">過去データの条件別実績を比較した参考スコア</div></div><div id="predictionTarget" class="muted"></div></div>
    <div id="predictionGrid" class="predictionGrid"></div>
    <div id="consensusBox" class="aiBox"></div>
    <div id="aiBox" class="aiBox"></div>
    <div id="aiAccuracyBox" class="aiAccuracyBox"></div>
    <div id="editorChiefBox" class="editorChiefBox"></div>
    <div id="regBiasBox" class="regBiasBox" aria-label="REGとBIGの偏りによる翌日実績"></div>
    <div id="editorChiefAccuracy" class="aiAccuracyBox editorChiefAccuracy"></div>
    <div id="rankAuditBox" class="rankAuditBox" aria-label="Geminiと編集長の順位別的中率"></div>
    <div class="tiny" style="margin-top:9px">参考スコアは実際の勝率ではありません。未来の結果を保証するものではありません。</div>
  </section>

  <section id="mainPanel" class="panel" hidden>
    <div class="controls">
      <label>台番<select id="machineSel"></select></label>
      <label>期間<select id="monthSel"></select></label>
      <label>グラフ<select id="modeSel"><option value="cumulative">累計差枚</option><option value="daily">日別差枚</option><option value="monthly">月別差枚</option></select></label>
    </div>
    <div class="graphFocusLaunch"><button type="button" id="graphFocusOpen" aria-controls="graphFocusLayer" aria-haspopup="dialog">⛶ グラフだけ表示</button><small>スマホで拡大表示できます。横向きもおすすめです。</small></div>
    <div id="cards" class="cards"></div>
    <div class="chartWrap"><canvas id="chart"></canvas><div id="tooltip" class="tooltip"></div></div>
    <div id="legend" class="legend"></div>
    <div id="trendBox" class="trendBox"></div>
  </section>

  <details id="logicFold" class="panel" style="padding:0;overflow:hidden">
    <summary style="cursor:pointer;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:900;list-style:none">

function regBiasHistory(machine,level,throughDate){
  const rows=RECORDS.filter(r=>(machine===null||String(r.machineNo)===String(machine))&&String(r.date)<=throughDate);
  const machines=new Map();
  for(const r of rows){const key=String(r.machineNo);if(!machines.has(key))machines.set(key,[]);machines.get(key).push(r);}
  const matches=[];
  for(const rs of machines.values()){
    rs.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    for(let i=0;i+1<rs.length;i++){
      const a=rs[i],b=rs[i+1],bb=Number(a.bb)||0,rb=Number(a.rb)||0;
      if(Number(a.games)<1000||Number(b.games)<=0||!nextDay(a.date,b.date)||rb<=bb)continue;
      if(level===2&&rb<2*bb || level===3&&rb<3*bb)continue;
      matches.push({a,b});
    }
  }
  const n=matches.length,w=matches.filter(x=>Number(x.b.diff)>0).length;
  const sum=matches.reduce((v,x)=>v+(Number(x.b.diff)||0),0);
  const gameTotal=matches.reduce((v,x)=>v+(Number(x.b.games)||0),0);
  const bigTotal=matches.reduce((v,x)=>v+(Number(x.b.bb)||0),0);
  const regTotal=matches.reduce((v,x)=>v+(Number(x.b.rb)||0),0);

    nextBig:bigTotal?gameTotal/bigTotal:null,
    nextReg:regTotal?gameTotal/regTotal:null};

function regBiasSignal(m,lastDate){
  const last=RECORDS.find(r=>String(r.machineNo)===String(m)&&String(r.date)===lastDate);
  const bb=Number(last?.bb)||0,rb=Number(last?.rb)||0;
  const level=Number(last?.games)>=1000&&rb>bb?(rb>=3*bb?3:rb>=2*bb?2:1):0;

  const stats=regBiasHistory(String(m),level,lastDate);

  const posterior=(stats.w+6)/(stats.n+12);

  const bonus=Math.max(-2,Math.min(2,(posterior-.5)*weight));
  return{level,stats,bonus};

function geminiAccuracy(){const hist=mergedGeminiHistory(),out=[];for(const h of hist){const rows=RECORDS.filter(r=>String(r.date)===String(h.targetDate));if(!rows.length)continue;const actual=new Map();for(const r of rows)actual.set(String(r.machineNo),(actual.get(String(r.machineNo))||0)+(Number(r.diff)||0));const ranked=(h.ranking||[]).filter(x=>actual.has(String(x.machineNo)));if(!ranked.length)continue;const top=ranked[0],topDiff=actual.get(String(top.machineNo))||0,maxDiff=Math.max(...actual.values()),top2=ranked.slice(0,2);out.push({targetDate:String(h.targetDate),topMachine:String(top.machineNo),topDiff,plusHit:topDiff>0,bestHit:topDiff===maxDiff,top2Plus:top2.some(x=>(actual.get(String(x.machineNo))||0)>0)});}const n=out.length;return{n,plusHits:out.filter(x=>x.plusHit).length,bestHits:out.filter(x=>x.bestHit).length,top2Hits:out.filter(x=>x.top2Plus).length,avg:n?out.reduce((a,x)=>a+x.topDiff,0)/n:0,pendingDates:hist.filter(h=>!RECORDS.some(r=>String(r.date)===String(h.targetDate))).map(h=>String(h.targetDate)),recent:out.slice(-10).reverse()};}

/* 予想順位1〜3位の答え合わせ。3台すべての結果と稼働がある日だけ使用する。
   未確定日・一部欠損・0Gを除き、同じ条件で順位間の成績を比較する。 */
function threeRankAccuracy(history){
  const rows=new Map(RECORDS.map(r=>[String(r.date)+'|'+String(r.machineNo),r]));
  const seen=new Set(),days=[],pending=[];
  const sorted=(Array.isArray(history)?history:[]).slice().sort((a,b)=>String(a.targetDate).localeCompare(String(b.targetDate)));
  for(const h of sorted){
    const date=String(h.targetDate||'');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||seen.has(date))continue;
    seen.add(date);
    const raw=Array.isArray(h.ranking)?h.ranking:[];
    if(raw.length!==3)continue;
    const ranked=raw.map((x,i)=>({m:String(x.machineNo||''),rank:Number(x.rank)||i+1})).sort((a,b)=>a.rank-b.rank);
    if(ranked.some((x,i)=>!x.m||x.rank!==i+1)||new Set(ranked.map(x=>x.m)).size!==3)continue;
    if(h.sourceLatestDate&&String(h.sourceLatestDate)>=date)continue;
    const actual=ranked.map(x=>rows.get(date+'|'+x.m));
    if(actual.some(x=>!x||!(Number(x.games)>0))){
      pending.push(date);
      continue;
    }
    const max=Math.max(...actual.map(x=>Number(x.diff)||0));
    const outcomes=ranked.map((x,i)=>({
      m:x.m,
      diff:Number(actual[i].diff)||0,
      plus:Number(actual[i].diff)>0,
      first:(Number(actual[i].diff)||0)===max
    }));
    days.push({date,outcomes});
  }
  const byRank=[0,1,2].map(i=>{
    const results=days.map(d=>d.outcomes[i]);
    const n=results.length,plus=results.filter(x=>x.plus).length,top=results.filter(x=>x.first).length;
    const total=results.reduce((v,x)=>v+x.diff,0);
    return{rank:i+1,n,plus,top,rate:n?plus/n:0,topRate:n?top/n:0,avg:n?total/n:0};
  });
  return{days,pending,byRank};
}

  const url=new URL(window.location.href);
  if(graphFocusStore.value==='morita')url.searchParams.set('store','morita');
  else url.searchParams.delete('store');
  url.searchParams.set('focus','1');
  url.searchParams.set('focusMode',modeSel.value);
  if(monthSel.value!=='ALL')url.searchParams.set('focusMonth',monthSel.value);
  else url.searchParams.delete('focusMonth');
  window.location.assign(url.toString());
});
for(const [dst,src] of [[graphFocusMachine,machineSel],[graphFocusMonth,monthSel],[graphFocusMode,modeSel]]){
  dst.addEventListener('change',()=>{src.value=dst.value;graphZoomResetState();focusSyncFromMain();render();});
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!graphFocusLayer.hidden){e.preventDefault();graphFocusClose();}
  if(e.key==='Tab'&&!graphFocusLayer.hidden){
    const controls=[graphFocusCloseButton,graphFocusStore,graphFocusMachine,graphFocusMonth,graphFocusMode];
    const at=controls.indexOf(document.activeElement);
    if(at===0&&e.shiftKey){e.preventDefault();controls[controls.length-1].focus();}
    else if(at===controls.length-1&&!e.shiftKey){e.preventDefault();controls[0].focus();}
  }
});

[machineSel,monthSel,modeSel].forEach(x=>x.addEventListener('change',render));window.addEventListener('resize',()=>{if(RECORDS.length)render();});function showChartTooltip(e){if(graphZoomTouches.size>=2||graphZoomPinch)return;if(!points.length)return;const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,dist=1e9;for(const p of points){const d=(p.x-mx)*(p.x-mx)+(p.y-my)*(p.y-my);if(d<dist){dist=d;best=p;}}if(best&&dist<225){const d=best.d;tooltip.style.display='block';tooltip.style.left=Math.min(r.width-175,best.x+12)+'px';tooltip.style.top=Math.max(6,best.y-72)+'px';tooltip.innerHTML=(d.date||d.label)+'<br>日別差枚 '+signed(d.diff)+'枚<br>'+(modeSel.value==='cumulative'?'累計差枚 '+signed(d.value)+'枚':'差枚 '+signed(d.value)+'枚');}else tooltip.style.display='none';}
canvas.addEventListener('mousemove',showChartTooltip);
canvas.addEventListener('pointerdown',showChartTooltip);
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch')showChartTooltip(e);});canvas.addEventListener('mouseleave',()=>tooltip.style.display='none');
(async()=>{try{const [res,edRes,ghRes]=await Promise.all([fetch(STORE_DATA_URL+'?ts='+Date.now(),{cache:'no-store'}),fetch(STORE_EDITOR_URL+'?ts='+Date.now(),{cache:'no-store'}).catch(()=>null),(STORE_ID==='yuto'?fetch('./gemini-history.json?ts='+Date.now(),{cache:'no-store'}).catch(()=>null):Promise.resolve(null))]);if(!res.ok)throw new Error('data.json '+res.status);const data=await res.json();RECORDS=Array.isArray(data.records)?data.records:[];GENERATED_AT=data.generatedAt||'';AI_ANALYSIS=data.aiAnalysis||null;AI_ACCURACY=data.aiAccuracy||null;AI_HISTORY_PUBLIC=Array.isArray(data.aiHistory)?data.aiHistory:[];if(edRes&&edRes.ok){try{EDITOR_CHIEF=await edRes.json();}catch(_){EDITOR_CHIEF=null;}}if(ghRes&&ghRes.ok){try{const gh=await ghRes.json();GEMINI_HISTORY=Array.isArray(gh)?gh:(Array.isArray(gh.history)?gh.history:[]);}catch(_){GEMINI_HISTORY=[];}}if(!RECORDS.length&&STORE_ID==='yuto')throw new Error('公開データがまだありません。拡張から「今すぐ最新版を公開」を実行してください。');setup();}catch(e){const box=$('loadStatus');box.classList.add('error');box.innerHTML='公開データを読み込めませんでした。<br>'+String(e.message||e)+'<br><span class="muted">初回設定直後の場合は、GitHub Pagesの公開設定と data.json の配置を確認してください。</span>';}})();
</script>
