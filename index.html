:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;color:#202124;background:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:#f5f6f8}.wrap{width:min(1180px,calc(100% - 28px));margin:24px auto 60px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:16px}h1{font-size:clamp(24px,4vw,34px);margin:0 0 6px}h2{margin:0;font-size:19px}.muted{color:#6b7280;font-size:13px}.pill{padding:7px 12px;border-radius:999px;background:#e8f0fe;color:#174ea6;font-weight:800;white-space:nowrap}.panel{background:#fff;border:1px solid #e2e5e9;border-radius:14px;padding:18px;margin-top:15px;box-shadow:0 3px 14px rgba(0,0,0,.035)}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.controls label{font-weight:800;font-size:13px;display:flex;flex-direction:column;gap:6px}select{width:100%;border:1px solid #cfd4dc;border-radius:9px;padding:10px 11px;background:#fff;font:inherit}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:15px}.card{border:1px solid #e1e5eb;border-radius:12px;padding:13px;background:#fafbfc}.card .k{font-size:12px;color:#6b7280}.card .v{font-size:19px;font-weight:900;margin-top:5px;font-variant-numeric:tabular-nums}.blue{color:#1a73e8}.red{color:#d93025}.chartWrap{position:relative;margin-top:14px;border:1px solid #e1e5eb;border-radius:12px;overflow:hidden;background:#fff}.chartWrap canvas{display:block;width:100%;height:430px}.tooltip{display:none;position:absolute;z-index:2;min-width:160px;padding:8px 10px;border-radius:8px;background:rgba(17,24,39,.94);color:#fff;font-size:12px;line-height:1.55;pointer-events:none}.legend{margin-top:9px;color:#667085;font-size:12px;line-height:1.7}.tableWrap{overflow:auto;margin-top:12px;border:1px solid #e1e5eb;border-radius:10px}table{width:100%;min-width:900px;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:8px 10px;border-bottom:1px solid #edf0f3;text-align:right;white-space:nowrap;font-size:13px}th{background:#f7f8fa;position:sticky;top:0;color:#4b5563}th:first-child,td:first-child{text-align:left}.status{padding:14px;border-radius:10px;background:#f7f9fc;color:#4b5563;line-height:1.7}.error{background:#fff0ef;color:#a61b14;border:1px solid #f0c1bd}.trendBox{margin-top:14px;border:1px solid #dfe5ee;border-radius:12px;padding:14px;background:#f8fafc}.trendBox:empty{display:none}.trendCurrent{font-size:14px;font-weight:800;margin-bottom:10px}.trendGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.trendCard{background:#fff;border:1px solid #e1e5eb;border-radius:10px;padding:11px}.trendCard .k{font-size:11px;color:#6b7280}.trendCard .v{font-size:17px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}.trendNote{margin-top:9px;color:#6b7280;font-size:11px;line-height:1.6}.trendLow{color:#9a5b00}.trendGood{color:#0f7b3e}@media(max-width:800px){.controls,.cards,.trendGrid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.hero{flex-direction:column}.controls,.cards,.trendGrid{grid-template-columns:1fr}.wrap{width:calc(100% - 18px)}}
.predictionPanel{border-color:#c9d9f5;background:#fbfcff}.predictionHead{display:flex;justify-content:space-between;gap:12px;align-items:center}.predictionGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:13px}.predictionCard{border:1px solid #dfe5ee;border-radius:12px;padding:12px;background:#fff;min-width:0}.predictionCard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.predictionCard .machine{font-weight:900;font-size:17px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.rankBadge{font-size:10px;padding:2px 6px;border-radius:999px;background:#e8f0fe;color:#174ea6}.predictionCard .score{font-size:24px;font-weight:950;white-space:nowrap}.streakStrip{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;padding:7px 8px;border-radius:8px;background:#f3f5f8;font-size:11px}.streakStrip span{color:#6b7280}.streakStrip strong{font-size:13px}.streakStrip small{color:#6b7280}.predMetrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}.predMetric{border:1px solid #e5e9ef;border-radius:8px;padding:7px 8px;background:#fff;min-width:0}.predMetric span{display:block;color:#6b7280;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.predMetric strong{display:block;margin-top:2px;font-size:14px;font-variant-numeric:tabular-nums}.predMetric small{display:block;color:#7a828d;font-size:9px;margin-top:1px}.predFoot{font-size:10px;color:#6b7280;margin-top:7px}.aiBox{margin-top:14px;border:1px solid #dfe5ee;border-radius:12px;padding:13px;background:#f8fafc;line-height:1.6}.aiBox:empty{display:none}.aiBox h3{margin:0 0 7px;font-size:16px}.aiRank{display:grid;gap:7px;margin-top:8px}.aiRankCard{padding:10px!important;background:#fff;border:1px solid #e1e5eb;border-radius:9px}.aiRankHead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:5px}.rankNo{font-size:10px;background:#eef3fb;border-radius:999px;padding:2px 7px}.machineStrong{font-size:15px;font-weight:900}.conf{font-size:10px;color:#5f6368;border:1px solid #dfe5ee;border-radius:999px;padding:2px 7px}.aiDetail{display:grid;grid-template-columns:70px 1fr;gap:7px;font-size:11px;margin-top:4px}.aiDetail span:first-child{color:#6b7280}.factors{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:7px;font-size:10px}.factors em{font-style:normal;border-radius:999px;padding:3px 7px}.factors.plus em{background:#eef5ff;color:#1758a8}.factors.minus em{background:#fff0ef;color:#a72b20}.aiWatch{margin-top:9px;padding:9px 11px;background:#fff;border:1px solid #e1e5eb;border-radius:9px}.aiWatch ul{margin:5px 0 0 18px;padding:0}.aiWatch li{font-size:11px;margin:2px 0}.tiny{font-size:11px;color:#6b7280}@media(max-width:900px){.predictionGrid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.predictionGrid{grid-template-columns:1fr}.predictionHead{align-items:flex-start;flex-direction:column}.predMetrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.aiAccuracyBox{margin-top:10px;border:1px solid #dfe5ee;border-radius:12px;padding:13px;background:#f8fafc}.aiAccuracyBox:empty{display:none}.aiAccuracyBox h3{margin:0 0 8px;font-size:16px}.aiAccGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.aiAccCard{background:#fff;border:1px solid #e1e5eb;border-radius:9px;padding:9px;min-width:0}.aiAccCard span{display:block;font-size:10px;color:#6b7280}.aiAccCard strong{display:block;font-size:17px;margin-top:3px;font-variant-numeric:tabular-nums}.aiAccCard small{display:block;font-size:9px;color:#8a919b;margin-top:1px}.aiAccRecent{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:10px}.aiAccRecent>span{color:#6b7280}.aiAccRecent em{font-style:normal;border-radius:999px;padding:3px 7px;background:#f2f4f7}.aiAccRecent em.hit{background:#eef5ff;color:#1758a8}.aiAccRecent em.miss{background:#fff0ef;color:#a72b20}@media(max-width:850px){.aiAccGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.editorChiefBox{margin-top:12px;border:1px solid #d9c7f3;border-radius:12px;padding:13px;background:#fcfaff;line-height:1.6}.editorChiefBox:empty{display:none}.editorChiefBox h3,.editorChiefAccuracy h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.editorBadge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;background:#f0e8ff;color:#6b3fa0;font-size:10px;font-weight:800}.editorChiefBox .rankNo{background:#f0e8ff;color:#6b3fa0}.editorChiefAccuracy{border-color:#d9c7f3;background:#fcfaff}
.editorComment{margin-top:10px;border:1px solid #e3d7f5;border-radius:10px;background:#fff}.editorComment summary{cursor:pointer;padding:10px 12px;font-weight:800;color:#6b3fa0;list-style:none}.editorComment summary::-webkit-details-marker{display:none}.editorComment summary:after{content:"＋";float:right}.editorComment[open] summary:after{content:"−"}.editorCommentBody{padding:0 12px 12px;color:#374151;font-size:12px;line-height:1.85}.editorCommentBody p{margin:9px 0}.editorCommentBody p:first-child{margin-top:0}

<body>
<main class="wrap">
  <header class="hero">
    <div><h1 id="title">データ</h1><div id="subtitle" class="muted">データを読み込んでいます…</div></div>
    <div class="pill">データ</div>
  </header>

  <div id="loadStatus" class="panel status">最新データを読み込んでいます…</div>

  <section id="predictionPanel" class="panel predictionPanel" hidden>
    <div class="predictionHead"><div><h2>今日 / 次回の参考予想</h2><div class="muted">過去データの条件別実績を比較した参考スコア</div></div><div id="predictionTarget" class="muted"></div></div>
    <div id="predictionGrid" class="predictionGrid"></div>
    <div id="consensusBox" class="aiBox"></div>
    <div id="aiBox" class="aiBox"></div>
    <div id="aiAccuracyBox" class="aiAccuracyBox"></div>
    <div id="editorChiefBox" class="editorChiefBox"></div>
    <div id="editorChiefAccuracy" class="aiAccuracyBox editorChiefAccuracy"></div>
    <div class="tiny" style="margin-top:9px">参考スコアは実際の勝率ではありません。未来の結果を保証するものではありません。</div>
  </section>

  <section id="mainPanel" class="panel" hidden>
    <div class="controls">
      <label>台番<select id="machineSel"></select></label>
      <label>月<select id="monthSel"></select></label>
      <label>グラフ<select id="modeSel"><option value="cumulative">累計差枚</option><option value="daily">日別差枚</option><option value="monthly">月別差枚</option></select></label>
    </div>
    <div id="cards" class="cards"></div>
    <div class="chartWrap"><canvas id="chart"></canvas><div id="tooltip" class="tooltip"></div></div>
    <div id="legend" class="legend"></div>
    <div id="trendBox" class="trendBox"></div>
  </section>

  <details id="logicFold" class="panel" style="padding:0;overflow:hidden">
    <summary style="cursor:pointer;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:900;list-style:none">
      <span>予想・分析ロジック一覧 <span class="muted" style="font-weight:500;margin-left:8px">現在の条件該当状況も確認</span></span>
      <span style="font-size:11px;color:#6b3fa0;background:#f0e8ff;border-radius:999px;padding:4px 9px;white-space:nowrap">クリックで開閉</span>
    </summary>
    <div style="border-top:1px solid #e2e5e9;background:#fff">
      <iframe src="./logic.html" title="予想・分析ロジック一覧" loading="lazy" style="width:100%;height:78vh;min-height:720px;border:0;display:block;background:#fff"></iframe>
    </div>
  </details>

  <section id="tablePanel" class="panel" hidden>
    <h2>日別データ</h2>
    <div class="tableWrap"><table><thead><tr><th>日付</th><th>曜</th><th>台番</th><th>G数</th><th>差枚</th><th>BB</th><th>RB</th><th>合算</th><th>BB確率</th><th>RB確率</th></tr></thead><tbody id="tbody"></tbody></table></div>
  </section>
</main>
<script>
let RECORDS=[];let GENERATED_AT='';let AI_ANALYSIS=null;let AI_ACCURACY=null;let AI_HISTORY_PUBLIC=[];let GEMINI_HISTORY=[];let EDITOR_CHIEF=null;let points=[];
const $=id=>document.getElementById(id);const machineSel=$('machineSel'),monthSel=$('monthSel'),modeSel=$('modeSel'),canvas=$('chart'),tooltip=$('tooltip');
function fmt(n){return Math.round(Number(n)||0).toLocaleString('ja-JP')}function signed(n){n=Number(n)||0;return(n>0?'+':'')+fmt(n)}function prob(n){return Number(n)>0?'1/'+Number(n).toFixed(1):'-'}function shortDate(d){return d?String(d).replace(/^\d{4}-/,'').replace('-','/'):'-'}
function dayNumber(d){const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?Date.UTC(+m[1],+m[2]-1,+m[3])/86400000:NaN}function nextDay(a,b){const x=dayNumber(a),y=dayNumber(b);return Number.isFinite(x)&&Number.isFinite(y)&&y-x===1}
function addDays(d,n){const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return'';const x=new Date(+m[1],+m[2]-1,+m[3],12);x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}function weekdayJa(d){return['日','月','火','水','木','金','土'][new Date(d+'T12:00:00').getDay()]||''}function ending(d){const m=String(d||'').match(/-(\d{2})$/);return m?Number(m[1])%10:null}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function filtered(){const m=machineSel.value,mo=monthSel.value;return RECORDS.filter(r=>(m==='ALL'||String(r.machineNo)===m)&&(mo==='ALL'||String(r.date).startsWith(mo)));}
function daily(rows){const map=new Map();for(const r of rows){if(!map.has(r.date))map.set(r.date,{date:r.date,games:0,diff:0,rows:0});const d=map.get(r.date);d.games+=Number(r.games)||0;d.diff+=Number(r.diff)||0;d.rows++;}return[...map.values()].sort((a,b)=>a.date.localeCompare(b.date));}
function extremes(ds){if(!ds.length)return null;let hi=ds[0],lo=ds[0];for(const d of ds){if(d.diff>hi.diff)hi=d;if(d.diff<lo.diff)lo=d;}return{hi,lo};}
function streakEndingAt(ds,i){if(!ds.length||i<0||i>=ds.length)return null;const sign=Math.sign(Number(ds[i].diff)||0);if(!sign)return{sign:0,days:0,diff:0,start:ds[i].date,end:ds[i].date};let a=i,sum=Number(ds[i].diff)||0;while(a>0&&nextDay(ds[a-1].date,ds[a].date)&&Math.sign(Number(ds[a-1].diff)||0)===sign){a--;sum+=Number(ds[a].diff)||0}return{sign,days:i-a+1,diff:sum,start:ds[a].date,end:ds[i].date}}
function streaks(ds){let bestUp={days:0,diff:0,start:'',end:''},bestDn={days:0,diff:0,start:'',end:''};for(let i=0;i<ds.length;i++){const r=streakEndingAt(ds,i);if(!r||!r.sign)continue;if(r.sign>0&&(r.days>bestUp.days||(r.days===bestUp.days&&r.diff>bestUp.diff)))bestUp={days:r.days,diff:r.diff,start:r.start,end:r.end};if(r.sign<0&&(r.days>bestDn.days||(r.days===bestDn.days&&r.diff<bestDn.diff)))bestDn={days:r.days,diff:r.diff,start:r.start,end:r.end};}return{bestUp,bestDn};}
function trendAnalysis(){const m=machineSel.value,mo=monthSel.value;const all=daily(RECORDS.filter(r=>m==='ALL'||String(r.machineNo)===m));if(!all.length)return null;const visible=mo==='ALL'?all:all.filter(d=>String(d.date).startsWith(mo));if(!visible.length)return null;const endpoint=visible[visible.length-1].date,idx=all.findIndex(d=>d.date===endpoint),current=streakEndingAt(all,idx);if(!current||!current.sign)return{current,cases:[],nextCount:0,nextPlus:0,nextAvg:0,twoCount:0,twoPlus:0};const cases=[];for(let i=0;i<idx;i++){const r=streakEndingAt(all,i);if(!r||r.sign!==current.sign||r.days!==current.days)continue;const n=all[i+1];if(!n||!nextDay(all[i].date,n.date))continue;const n2=all[i+2],has2=!!(n2&&nextDay(n.date,n2.date));cases.push({nextDiff:Number(n.diff)||0,nextPlus:(Number(n.diff)||0)>0,has2,twoPlus:has2?((Number(n.diff)||0)>0||(Number(n2.diff)||0)>0):false});}const nextCount=cases.length,nextPlus=cases.filter(c=>c.nextPlus).length,nextAvg=nextCount?cases.reduce((a,c)=>a+c.nextDiff,0)/nextCount:0,two=cases.filter(c=>c.has2),twoCount=two.length,twoPlus=two.filter(c=>c.twoPlus).length;return{current,cases,nextCount,nextPlus,nextAvg,twoCount,twoPlus};}
function renderTrend(){const box=$('trendBox'),a=trendAnalysis();if(!a){box.innerHTML='';return}if(!a.current||!a.current.sign){box.innerHTML='<div class="trendCurrent">選択期間末は差枚0枚のため、連続上昇・下降の傾向判定はありません。</div><div class="trendNote">過去実績であり、今後の結果を保証する予測ではありません。</div>';return}const c=a.current,dir=c.sign>0?'上昇':'下降',color=c.sign>0?'blue':'red',sample=a.nextCount?a.nextCount+'回':'該当なし',nextRate=a.nextCount?(a.nextPlus/a.nextCount*100).toFixed(1)+'% ('+a.nextPlus+'/'+a.nextCount+')':'-',twoRate=a.twoCount?(a.twoPlus/a.twoCount*100).toFixed(1)+'% ('+a.twoPlus+'/'+a.twoCount+')':'-',avgCls=a.nextAvg>0?'blue':a.nextAvg<0?'red':'';box.innerHTML='<div class="trendCurrent">現在：<span class="'+color+'">'+c.days+'日連続'+dir+' ('+signed(c.diff)+'枚) '+shortDate(c.start)+'〜'+shortDate(c.end)+'</span></div><div class="trendGrid"><div class="trendCard"><div class="k">過去の同条件</div><div class="v '+(a.nextCount>=10?'trendGood':'trendLow')+'">'+sample+'</div></div><div class="trendCard"><div class="k">翌日プラス率</div><div class="v">'+nextRate+'</div></div><div class="trendCard"><div class="k">翌日平均差枚</div><div class="v '+avgCls+'">'+(a.nextCount?signed(a.nextAvg)+'枚':'-')+'</div></div><div class="trendCard"><div class="k">2日以内にプラス</div><div class="v">'+twoRate+'</div></div></div><div class="trendNote">同条件＝同じ台番条件で、同じ方向・同じ連続日数になった過去ケース。データが抜けた日は連続扱いしません。'+(a.nextCount&&a.nextCount<5?' 参考件数が少ないため、数値の振れが大きいです。':'')+' 過去実績であり、次回の結果を保証する予測ではありません。</div>';}

function renderCards(ds){const games=ds.reduce((a,d)=>a+d.games,0),diff=ds.reduce((a,d)=>a+d.diff,0),wins=ds.filter(d=>d.diff>0).length,payout=games?(1+diff/(games*3))*100:100,ex=extremes(ds),st=streaks(ds);$('cards').innerHTML=[['総G数',fmt(games)+'G',''],['総差枚',signed(diff)+'枚',diff>=0?'blue':'red'],['機械割',games?payout.toFixed(2)+'%':'-',''],['勝率',ds.length?(wins/ds.length*100).toFixed(1)+'%':'-',''],['最大差枚',ex?signed(ex.hi.diff)+'枚 '+shortDate(ex.hi.date):'-','blue'],['最大マイナス',ex?signed(ex.lo.diff)+'枚 '+shortDate(ex.lo.date):'-','red'],['最長上昇',st.bestUp.days?st.bestUp.days+'日 ('+signed(st.bestUp.diff)+'枚) '+shortDate(st.bestUp.start)+'〜'+shortDate(st.bestUp.end):'-','blue'],['最長下降',st.bestDn.days?st.bestDn.days+'日 ('+signed(st.bestDn.diff)+'枚) '+shortDate(st.bestDn.start)+'〜'+shortDate(st.bestDn.end):'-','red']].map(x=>'<div class="card"><div class="k">'+x[0]+'</div><div class="v '+x[2]+'">'+x[1]+'</div></div>').join('');}
function series(ds){const mode=modeSel.value;if(mode==='monthly'){const m=new Map();for(const d of ds)m.set(d.date.slice(0,7),(m.get(d.date.slice(0,7))||0)+d.diff);return[...m].sort().map(([label,value])=>({label,value,diff:value,date:label}));}if(mode==='daily')return ds.map(d=>({label:shortDate(d.date),value:d.diff,diff:d.diff,date:d.date}));let sum=0;return ds.map(d=>{sum+=d.diff;return{label:shortDate(d.date),value:sum,diff:d.diff,date:d.date};});}
function draw(ds){const data=series(ds),rect=canvas.getBoundingClientRect(),W=Math.max(320,Math.floor(rect.width||1000)),H=430,dpr=Math.max(1,devicePixelRatio||1);canvas.width=W*dpr;canvas.height=H*dpr;const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);points=[];if(!data.length){c.fillStyle='#6b7280';c.font='14px system-ui';c.fillText('データなし',24,40);$('legend').textContent='';return;}const p={l:68,r:24,t:24,b:48},w=W-p.l-p.r,h=H-p.t-p.b;let min=Math.min(0,...data.map(d=>d.value)),max=Math.max(0,...data.map(d=>d.value));if(max===min){max+=100;min-=100;}const range=max-min||1,x=i=>p.l+(data.length===1?w/2:i*w/(data.length-1)),y=v=>p.t+(max-v)*h/range;c.strokeStyle='#e4e8ee';c.fillStyle='#6b7280';c.font='12px system-ui';for(let i=0;i<=4;i++){const val=max-range*i/4,yy=p.t+h*i/4;c.beginPath();c.moveTo(p.l,yy);c.lineTo(p.l+w,yy);c.stroke();c.textAlign='right';c.textBaseline='middle';c.fillText(Math.round(val).toLocaleString('ja-JP'),p.l-8,yy);}if(min<0&&max>0){c.strokeStyle='#9aa0a6';c.beginPath();c.moveTo(p.l,y(0));c.lineTo(p.l+w,y(0));c.stroke();}const mode=modeSel.value;if(mode==='daily'){const bw=Math.max(2,Math.min(14,w/Math.max(1,data.length)*.72)),y0=y(0);data.forEach((d,i)=>{const yy=y(d.value);c.fillStyle=d.value>=0?'#1a73e8':'#d93025';c.fillRect(x(i)-bw/2,Math.min(yy,y0),bw,Math.max(1,Math.abs(y0-yy)));});}else if(mode==='cumulative'){for(let i=1;i<data.length;i++){c.strokeStyle=data[i].diff>0?'#1a73e8':data[i].diff<0?'#d93025':'#9aa0a6';c.lineWidth=2.5;c.beginPath();c.moveTo(x(i-1),y(data[i-1].value));c.lineTo(x(i),y(data[i].value));c.stroke();}data.forEach((d,i)=>{c.beginPath();c.fillStyle=d.diff>0?'#1a73e8':d.diff<0?'#d93025':'#9aa0a6';c.arc(x(i),y(d.value),4,0,Math.PI*2);c.fill();c.strokeStyle='#fff';c.stroke();});}else{c.strokeStyle='#1a73e8';c.lineWidth=2.5;c.beginPath();data.forEach((d,i)=>i?c.lineTo(x(i),y(d.value)):c.moveTo(x(i),y(d.value)));c.stroke();data.forEach((d,i)=>{c.beginPath();c.fillStyle=d.value>=0?'#1a73e8':'#d93025';c.arc(x(i),y(d.value),4,0,Math.PI*2);c.fill();});}const maxLabels=Math.min(6,Math.max(2,Math.floor(w/150))),step=Math.max(1,Math.ceil((data.length-1)/Math.max(1,maxLabels-1)));c.fillStyle='#6b7280';c.font='11px system-ui';c.textAlign='center';c.textBaseline='top';data.forEach((d,i)=>{if(i%step===0||i===data.length-1)c.fillText(d.label,x(i),p.t+h+10);});points=data.map((d,i)=>({x:x(i),y:y(d.value),d}));const ex=extremes(ds),st=streaks(ds);$('legend').innerHTML=(ex?'<span class="blue">最大差枚 '+signed(ex.hi.diff)+'枚 '+shortDate(ex.hi.date)+'</span> / <span class="red">最大マイナス '+signed(ex.lo.diff)+'枚 '+shortDate(ex.lo.date)+'</span> / ':'')+'<span class="blue">最長上昇 '+st.bestUp.days+'日 ('+signed(st.bestUp.diff)+'枚) '+shortDate(st.bestUp.start)+'〜'+shortDate(st.bestUp.end)+'</span> / <span class="red">最長下降 '+st.bestDn.days+'日 ('+signed(st.bestDn.diff)+'枚) '+shortDate(st.bestDn.start)+'〜'+shortDate(st.bestDn.end)+'</span>';}
function renderTable(rows){$('tbody').innerHTML=rows.slice().sort((a,b)=>b.date.localeCompare(a.date)||Number(a.machineNo)-Number(b.machineNo)).map(r=>'<tr><td>'+r.date+'</td><td>'+(r.weekday||'')+'</td><td>'+r.machineNo+'</td><td>'+fmt(r.games)+'</td><td class="'+(Number(r.diff)>=0?'blue':'red')+'">'+signed(r.diff)+'</td><td>'+r.bb+'</td><td>'+r.rb+'</td><td>'+prob(r.totalProb)+'</td><td>'+prob(r.bbProb)+'</td><td>'+prob(r.rbProb)+'</td></tr>').join('');}
function render(){const rows=filtered(),ds=daily(rows);renderCards(ds);draw(ds);renderTrend();renderTable(rows);}
function setup(){const machines=[...new Set(RECORDS.map(r=>String(r.machineNo)))].sort((a,b)=>Number(a)-Number(b));machineSel.innerHTML='<option value="ALL">全台合計</option>'+machines.map(m=>'<option value="'+m+'">台番 '+m+'</option>').join('');const months=[...new Set(RECORDS.map(r=>String(r.date).slice(0,7)))].sort().reverse();monthSel.innerHTML='<option value="ALL">全期間</option>'+months.map(m=>'<option value="'+m+'">'+m.replace('-','年')+'月</option>').join('');$('title').textContent='データ';$('subtitle').textContent='保存データ '+RECORDS.length.toLocaleString('ja-JP')+'行 / 最終更新 '+(GENERATED_AT?new Date(GENERATED_AT).toLocaleString('ja-JP'):'-');$('loadStatus').hidden=true;$('mainPanel').hidden=false;$('tablePanel').hidden=false;renderPredictions();renderAiAccuracy();renderEditorChief();render();}
[machineSel,monthSel,modeSel].forEach(x=>x.addEventListener('change',render));window.addEventListener('resize',()=>{if(RECORDS.length)render();});canvas.addEventListener('mousemove',e=>{if(!points.length)return;const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,dist=1e9;for(const p of points){const d=(p.x-mx)*(p.x-mx)+(p.y-my)*(p.y-my);if(d<dist){dist=d;best=p;}}if(best&&dist<225){const d=best.d;tooltip.style.display='block';tooltip.style.left=Math.min(r.width-175,best.x+12)+'px';tooltip.style.top=Math.max(6,best.y-72)+'px';tooltip.innerHTML=(d.date||d.label)+'<br>日別差枚 '+signed(d.diff)+'枚<br>'+(modeSel.value==='cumulative'?'累計差枚 '+signed(d.value)+'枚':'差枚 '+signed(d.value)+'枚');}else tooltip.style.display='none';});canvas.addEventListener('mouseleave',()=>tooltip.style.display='none');
(async()=>{try{const [res,edRes,ghRes]=await Promise.all([fetch('./data.json?ts='+Date.now(),{cache:'no-store'}),fetch('./editor.json?ts='+Date.now(),{cache:'no-store'}).catch(()=>null),fetch('./gemini-history.json?ts='+Date.now(),{cache:'no-store'}).catch(()=>null)]);if(!res.ok)throw new Error('data.json '+res.status);const data=await res.json();RECORDS=Array.isArray(data.records)?data.records:[];GENERATED_AT=data.generatedAt||'';AI_ANALYSIS=data.aiAnalysis||null;AI_ACCURACY=data.aiAccuracy||null;AI_HISTORY_PUBLIC=Array.isArray(data.aiHistory)?data.aiHistory:[];if(edRes&&edRes.ok){try{EDITOR_CHIEF=await edRes.json();}catch(_){EDITOR_CHIEF=null;}}if(ghRes&&ghRes.ok){try{const gh=await ghRes.json();GEMINI_HISTORY=Array.isArray(gh)?gh:(Array.isArray(gh.history)?gh.history:[]);}catch(_){GEMINI_HISTORY=[];}}if(!RECORDS.length)throw new Error('公開データがまだありません。拡張から「今すぐ最新版を公開」を実行してください。');setup();}catch(e){const box=$('loadStatus');box.classList.add('error');box.innerHTML='公開データを読み込めませんでした。<br>'+String(e.message||e)+'<br><span class="muted">初回設定直後の場合は、GitHub Pagesの公開設定と data.json の配置を確認してください。</span>';}})();
