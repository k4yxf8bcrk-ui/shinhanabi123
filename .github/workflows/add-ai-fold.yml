name: Add AI prediction fold
on:
  push:
    paths:
      - public-ai-fold.trigger
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load fold script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./public-ai-fold.js?v=2"></script>'
          if tag not in s:
              marker='</body>'
              s=s.replace(marker, tag+'\n'+marker)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Enable collapsible AI prediction"
          git push
