name: Analyze all-negative days

on:
  push:
    paths:
      - 'all-negative.trigger'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Analyze
        run: |
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('data.json','utf8'));
          const machines=['3232','3233','3235'];
          const byDate=new Map();
          for(const r of data.records||[]){
            const m=String(r.machineNo);
            if(!machines.includes(m)) continue;
            const d=String(r.date);
            if(!byDate.has(d)) byDate.set(d,new Map());
            byDate.get(d).set(m,r);
          }
          const eligible=[];
          for(const [date,map] of [...byDate.entries()].sort((a,b)=>a[0].localeCompare(b[0]))){
            if(!machines.every(m=>map.has(m)&&Number(map.get(m).games)>0)) continue;
            const rows=machines.map(m=>map.get(m));
            eligible.push({date,allNegative:rows.every(r=>Number(r.diff)<0),diffs:Object.fromEntries(rows.map(r=>[String(r.machineNo),Number(r.diff)||0]))});
          }
          const summarize=arr=>({
            n:arr.length,
            allNegativeCount:arr.filter(x=>x.allNegative).length,
            allNegativeRate:arr.length?arr.filter(x=>x.allNegative).length/arr.length:null
          });
          const neg=eligible.filter(x=>x.allNegative);
          const out={
            generatedAt:new Date().toISOString(),
            sourceGeneratedAt:data.generatedAt||null,
            definition:'3232,3233,3235 all have games > 0 on the same calendar day; all-negative means all three diff < 0.',
            all:summarize(eligible),
            recent30:summarize(eligible.slice(-30)),
            recent60:summarize(eligible.slice(-60)),
            dates:neg.map(x=>x.date),
            recentCases:neg.slice(-20).reverse()
          };
          fs.writeFileSync('all-negative-analysis.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - name: Commit result
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add all-negative-analysis.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update all-negative analysis'
          git push
