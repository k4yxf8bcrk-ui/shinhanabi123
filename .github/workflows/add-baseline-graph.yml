name: Publish baseline graph
on:
  push:
    paths:
      - baseline-graph.trigger
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add loader and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          js=Path('public-v13.js')
          s=js.read_text(encoding='utf-8')
          loader="\n(()=>{const s=document.createElement('script');s.src='./public-baseline-graph.js?v=1';s.defer=true;document.body.appendChild(s);})();\n"
          if 'public-baseline-graph.js' not in s:
              js.write_text(s.rstrip()+loader,encoding='utf-8')
          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          def bump(m):
              return 'public-v13.js?v='+str(int(m.group(1))+1)
          h2,n=re.subn(r'public-v13\.js\?v=(\d+)',bump,h,count=1)
          if n==0:
              raise SystemExit('public-v13.js cache reference not found')
          idx.write_text(h2,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-v13.js index.html
          git commit -m "Publish normal-day baseline graph" || true
          git push
