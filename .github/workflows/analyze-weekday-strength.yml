name: Analyze weekday strength

on:
  push:
    paths:
      - 'weekday-strength.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze weekday strength
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from statistics import mean, median

          with open('data.json', encoding='utf-8') as f:
              data=json.load(f)
          records=data.get('records',[])
          machines=['3232','3233','3235']
          order=['月','火','水','木','金','土','日']

          by_date=defaultdict(dict)
          for r in records:
              m=str(r.get('machineNo',''))
              if m in machines:
                  by_date[str(r.get('date',''))][m]=r

          overall={}
          for wd in order:
              days=[]
              for date, mm in by_date.items():
                  if not all(m in mm and float(mm[m].get('games',0) or 0)>0 for m in machines):
                      continue
                  rows=[mm[m] for m in machines]
                  if str(rows[0].get('weekday','')) != wd:
                      continue
                  total_diff=sum(float(x.get('diff',0) or 0) for x in rows)
                  total_games=sum(float(x.get('games',0) or 0) for x in rows)
                  days.append((date,total_diff,total_games,[float(x.get('diff',0) or 0) for x in rows]))
              n=len(days)
              totals=[x[1] for x in days]
              games=[x[2] for x in days]
              overall[wd]={
                  'n':n,
                  'avgTotalDiff': round(mean(totals),2) if n else None,
                  'medianTotalDiff': round(median(totals),2) if n else None,
                  'positiveDayRate': sum(1 for x in totals if x>0)/n if n else None,
                  'allNegativeRate': sum(1 for _,_,_,ds in days if all(v<0 for v in ds))/n if n else None,
                  'avgPerMachineDiff': round(mean(totals)/3,2) if n else None,
                  'avgTotalGames': round(mean(games),2) if n else None,
                  'avgPerMachineGames': round(mean(games)/3,2) if n else None,
              }

          machine_stats={}
          for m in machines:
              machine_stats[m]={}
              rs=[r for r in records if str(r.get('machineNo',''))==m and float(r.get('games',0) or 0)>0]
              for wd in order:
                  rows=[r for r in rs if str(r.get('weekday',''))==wd]
                  xs=[float(r.get('diff',0) or 0) for r in rows]
                  gs=[float(r.get('games',0) or 0) for r in rows]
                  n=len(xs)
                  machine_stats[m][wd]={
                      'n':n,
                      'avgDiff':round(mean(xs),2) if n else None,
                      'medianDiff':round(median(xs),2) if n else None,
                      'plusRate':sum(1 for x in xs if x>0)/n if n else None,
                      'avgGames':round(mean(gs),2) if n else None,
                      'medianGames':round(median(gs),2) if n else None,
                  }

          ranking=sorted(order,key=lambda wd:(overall[wd]['avgTotalDiff'] if overall[wd]['avgTotalDiff'] is not None else -10**18),reverse=True)
          out={
              'generatedAt':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'sourceGeneratedAt':data.get('generatedAt'),
              'definition':'Overall weekday strength uses only calendar days where 3232, 3233 and 3235 all have games > 0. Machine stats use that machine active days only.',
              'weekdayRanking':ranking,
              'overall':overall,
              'machines':machine_stats,
          }
          with open('weekday-strength-analysis.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - name: Commit result
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add weekday-strength-analysis.json
          git diff --cached --quiet || git commit -m "Update weekday strength analysis"
          git push
