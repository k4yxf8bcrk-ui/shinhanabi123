name: Add range bonus summary
on:
  push:
    paths:
      - public-range-bonus.trigger
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add range bonus script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./public-range-bonus.js?v=1"></script>'
          if tag not in s:
              s=s.replace('<script src="./public-v13.js?v=14"></script>', '<script src="./public-v13.js?v=14"></script>\n'+tag)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Load range bonus summary"
          git push
