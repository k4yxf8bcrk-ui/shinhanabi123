name: Publish dip recovery analysis
on:
  push:
    paths:
      - fix-baseline-saturday.trigger
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add dip recovery loader and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pv=Path('public-v13.js')
          s=pv.read_text(encoding='utf-8')
          loader="\n(()=>{const s=document.createElement('script');s.src='./public-dip-recovery.js?v=1';s.defer=true;document.body.appendChild(s);})();\n"
          if 'public-dip-recovery.js' not in s:
              s=s.rstrip()+loader
          else:
              s=re.sub(r"public-dip-recovery\.js\?v=\d+", "public-dip-recovery.js?v=1", s)
          pv.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          def bump(m): return 'public-v13.js?v='+str(int(m.group(1))+1)
          h2,n=re.subn(r'public-v13\.js\?v=(\d+)',bump,h,count=1)
          if n==0: raise SystemExit('public-v13 cache ref not found')
          idx.write_text(h2,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public-v13.js index.html
          git commit -m "Publish dip recovery analysis" || true
          git pull --rebase origin main
          git push
